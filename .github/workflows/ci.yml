name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - run: python -m verifierfuzz demo
      - run: >-
          python -m verifierfuzz regression
          --adapter pair
          --oracle-adapter pair
          --target-policy zero-one
          --oracle-policy zero-one
          --target examples/simple_rewards.py:target
          --oracle examples/simple_rewards.py:oracle
          --corpus examples/regression.jsonl
